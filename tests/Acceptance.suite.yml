actor: AcceptanceTester
extensions:
  enabled:
    - Codeception\Extension\RunProcess:
        0: set APP_ENV=test
        1: composer serve
        sleep: 10
modules:
  enabled:
    - WebDriver:
        url: http://localhost:8080
        browser: chrome
        window_size: 1280x720
        # Position browser so that it's visible during the demo.
        capabilities:
          goog:chromeOptions:
            args:
              - "--window-position=-1920,0"
    - Db:
        dsn: 'pgsql:host=localhost;port=5432;dbname=yii3_admin_test'
        user: 'postgres'
        password: 'password'
        dump: 'tests/Support/Data/dump.sql'
        cleanup: true
        populate: true
